# Hermes Agent — personal deployment
# Hello world:  ./deploy.sh hello
# Dev shell:    ./deploy.sh dev
# Web UI:       ./deploy.sh webui
# Gateway:      ./deploy.sh gateway   (+ socket-proxy sidecar)
# Growatt:      add `growatt` to COMPOSE_PROFILES in .env, then ./deploy.sh gateway

x-hermes: &hermes
  build:
    context: https://github.com/NousResearch/hermes-agent.git#v2026.5.29.2
    dockerfile: Dockerfile
  image: personal-hermes/hermes:v2026.5.29.2
  environment:
    HERMES_UID: ${HERMES_UID:-1000}
    HERMES_GID: ${HERMES_GID:-1000}

services:
  hello:
    <<: *hermes
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
    command:
      - -z
      - Reply with exactly one short hello sentence. Do not use tools.

  dev:
    <<: *hermes
    profiles: [dev]
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      - ./skills:/workspace/skills
      - ./skill-bundles:/opt/data/skill-bundles:ro
      - ${GROWATT_AUDIT_DIR:-./data/growatt-bridge}:/workspace/growatt-audit:ro
    stdin_open: true
    tty: true

  # Copies /opt/hermes from the hermes image into a named volume so webui
  # can install hermes-agent's Python deps from source. Runs once per
  # `deploy.sh webui` invocation (cp is fast on subsequent runs).
  # Bypasses s6-overlay (entrypoint override) so the copy runs as root
  # and can write to the initially root-owned named volume.
  hermes-src-init:
    image: personal-hermes/hermes:v2026.5.29.2
    profiles: [webui]
    entrypoint: ["sh", "-c", "cp -rp /opt/hermes/. /target/ && chmod -R a+rX /target"]
    volumes:
      - hermes-agent-src:/target
    restart: "no"

  webui:
    profiles: [webui]
    depends_on:
      hermes-src-init:
        condition: service_completed_successfully
    build:
      context: https://github.com/nesquena/hermes-webui.git#v0.51.99
      dockerfile: Dockerfile
    image: personal-hermes/hermes-webui:v0.51.99
    container_name: hermes-webui
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/home/hermeswebui/.hermes
      - hermes-agent-src:/opt/hermes:ro
    environment:
      WANTED_UID: ${HERMES_UID:-1000}
      WANTED_GID: ${HERMES_GID:-1000}
      HERMES_WEBUI_HOST: 0.0.0.0
      HERMES_WEBUI_PORT: "8787"
      HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
      HERMES_HOME: /home/hermeswebui/.hermes

  # Docker socket proxy — lets the gateway start/stop/restart containers and
  # tail logs via HTTP without exposing the full Docker daemon.
  # Bound to 127.0.0.1 only; gateway (host networking) reaches it via localhost.
  socket-proxy:
    profiles: [gateway]
    image: tecnativa/docker-socket-proxy:latest
    container_name: hermes-socket-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:2375:2375"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1       # list, inspect, logs
      POST: 1             # allow POST requests
      ALLOW_START: 1      # /containers/{id}/start
      ALLOW_STOP: 1       # /containers/{id}/stop
      ALLOW_RESTARTS: 1   # /containers/{id}/restart
      LOG_LEVEL: warning

  growatt-bridge:
    profiles: [growatt]
    platform: linux/amd64
    image: ${GROWATT_BRIDGE_IMAGE:-ghcr.io/qbamca/growatt-bridge:latest}
    container_name: growatt-bridge
    restart: unless-stopped
    ports:
      - "${GROWATT_BRIDGE_PORT:-8081}:8081"
    volumes:
      - ${GROWATT_AUDIT_DIR:-./data/growatt-bridge}:/var/log/growatt-bridge
    env_file:
      - .env.growatt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  gateway:
    <<: *hermes
    profiles: [gateway]
    container_name: hermes-gateway
    restart: unless-stopped
    network_mode: host
    volumes:
      - ${HERMES_DATA_DIR:-./data/hermes}:/opt/data
      - ./skills:/workspace/skills
      - ./skill-bundles:/opt/data/skill-bundles:ro
      - ./skill-bundles:/opt/data/profiles/solar/skill-bundles:ro
      - ${GROWATT_AUDIT_DIR:-./data/growatt-bridge}:/opt/data/workspace/growatt-audit:ro
    environment:
      HERMES_UID: ${HERMES_UID:-1000}
      HERMES_GID: ${HERMES_GID:-1000}
      # Docker socket proxy — used by the service-control skill to
      # start/stop/restart containers and tail logs via HTTP.
      DOCKER_HOST: tcp://localhost:2375
    command: ["gateway", "run"]

volumes:
  hermes-agent-src:
